<script>
const CFX_ID = 'krdye6';
const SOURCES = [
  { url: 'https://frontend.cfx-services.net/api/servers/single/' + CFX_ID,
    parse: d => (d && d.Data) ? { online: (d.Data.clients != null ? d.Data.clients : (d.Data.players ? d.Data.players.length : 0)), max: d.Data.sv_maxclients } : null }
];
const dot = document.getElementById('bio-dot');
const txt = document.getElementById('bio-status-text');
let fails = 0, hadData = false;
function online(o, m) {
  hadData = true;
  dot.style.cssText = 'width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;flex-shrink:0;';
  txt.textContent = (o != null ? o : 0) + ' / ' + (m != null ? m : 64) + ' Online';
  txt.style.cssText = 'color:#4ade80;';
}
function unknown() {
  dot.style.cssText = 'width:8px;height:8px;border-radius:50%;background:#5a6a7a;flex-shrink:0;';
  if (!hadData) { txt.textContent = 'Status Unavailable'; txt.style.cssText = 'color:#5a6a7a;'; }
}
async function trySrc(s) {
  const res = await fetch(s.url, { signal: AbortSignal.timeout(7000) });
  if (!res.ok) throw new Error('http');
  const out = s.parse(await res.json());
  if (!out || out.max == null) throw new Error('shape');
  return out;
}
async function refresh() {
  try {
    const r = await Promise.any(SOURCES.map(trySrc));
    fails = 0; online(r.online, r.max);
  } catch (e) {
    fails++;
    unknown();
  }
}
refresh();
setInterval(refresh, 30000);
</script>
